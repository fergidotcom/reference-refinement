# Batch Processing Configuration - v20.0 TEST
# Process single reference to test deep validation

batch_processor:
  # INPUT FILES
  input_file: "decisions_backup_pre_web_session_2025_11_11.txt"
  output_file: "decisions_test_v20.txt"

  # REFERENCE SELECTION - Test with REF 315 only
  selection_mode: "specific_refs"
  specific_refs: [315]

  # Not used in specific_refs mode
  reference_range:
    start: 1
    end: 999
  max_references: 1

  # QUERY GENERATION - Use standard mode (8 queries)
  query_mode: "standard"  # 8 queries (6 primary + 2 secondary)

  # AUTO-FINALIZATION - DISABLED (user reviews on iPad)
  auto_finalize: false

  finalize_criteria:
    min_primary_score: 75
    min_secondary_score: 75
    require_title_match: false
    require_author_match: false
    max_warnings: 2

  # RATE LIMITING - Conservative
  rate_limiting:
    delay_between_refs: 2000   # 2 seconds between refs
    delay_after_search: 1000   # 1 second after search
    max_retries: 3
    timeout: 30000

  # API ENDPOINTS
  api_base_url: "https://rrv521-1760738877.netlify.app/.netlify/functions"

  # LOGGING
  logging:
    verbose: true
    save_logs: true
    log_directory: "batch-logs"
    include_api_responses: false

  # RESUME CAPABILITY
  resume:
    enabled: true
    checkpoint_frequency: 1  # Save after every reference
